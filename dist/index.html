<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>ARM - AttackRuleMap</title>
    <meta
      name="description"
      content="Mapping of open-source detection rules and atomic tests."
    />
    <link
      rel="icon"
      type="image/png"
      href="./assets/images/favicon/"
      sizes="96x96"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./assets/images/favicon/favicon.svg"
    />
    <link rel="shortcut icon" href="./assets/images/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/images/favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="ARM" />
    <link rel="manifest" href="./assets/images/favicon//site.webmanifest" />

    <link rel="stylesheet" href="./assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./assets/css/dataTables.bootstrap5.min.css" />
    <link rel="stylesheet" href="./assets/css/buttons.bootstrap5.min.css" />
    <link rel="stylesheet" href="./assets/css/fixedHeader.bootstrap5.min.css" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="ARM - AttackRuleMap" />
    <meta
      property="og:description"
      content="Mapping of open-source detection rules and atomic tests."
    />
    <meta
      property="og:image"
      content="https://attackrulemap.netlify.app/assets/images/og-logo.png"
    />
    <meta property="og:url" content="https://attackrulemap.netlify.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="attackrulemap.netlify.com" />
    <meta name="author" content="Burak Karaduman" />
    <style>
      @font-face {
        font-family: "Chakra Petch Regular";
        src: url("./assets/fonts/ChakraPetch-Regular.ttf") format("truetype");
        font-style: normal;
      }

      #header {
        font-family: "Chakra Petch Regular";
      }

      th {
        vertical-align: middle;
        white-space: nowrap;
      }

      table {
        font-size: 14px;
      }

      li {
        margin-bottom: 3px;
      }

      .mitre-tech-btn {
        background-color: #3f6894;
        font-size: 13px;
        color: white;
        border-radius: 2px;
      }

      .mitre-tech-btn:hover {
        background-color: #2b5178;
        color: white;
      }

      #theme-icons {
        cursor: pointer;
      }

      #scrollToTopBtn {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        border-radius: 50%;
        background-color: #3f6894;
        opacity: 0.7;
        width: 7 0px;
        height: 7 0px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        cursor: pointer;
        transition: opacity 0.3s ease;
      }

      #scrollToTopBtn:hover {
        opacity: 1;
      }

      svg {
        color: white;
      }

      #theme-icons svg:hover,
      #github-icon:hover {
        scale: 1.15;
      }

      #theme-icons svg,
      #github-icon {
        transition: 0.3s;
      }
    </style>
  </head>
  <body>
    <div id="main" class="container-fluid p-4">
      <div id="header" class="d-flex align-items-center">
        <img
          class="me-3"
          src="./assets/images/shield-logo.png"
          alt=""
          height="65"
        />
        <div id="header">
          <h2 class="text-start m-0 p-0">AttackRuleMap</h2>
          <p class="text-start text-muted m-0 p-0">
            Mapping of open-source detection rules and atomic tests.
          </p>
        </div>
        <div class="ms-auto d-flex flex-column align-items-center">
          <!-- Top: GitHub ve theme buttons -->
          <div class="d-flex justify-content-end align-items-center w-100">
            <a
              href="https://github.com/krdmnbrk/AttackRuleMap"
              target="_blank"
              rel="noopener noreferrer"
              class="me-3"
            >
              <img
                id="github-icon"
                src="./assets/images/github-logo.svg"
                alt="GitHub Logo"
                height="25"
              />
            </a>
            <div id="theme-icons" class="d-flex align-items-center">
              <svg
                id="light-mode-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="25"
                height="25"
                viewBox="0 0 16 16"
                fill="currentColor"
                class="bi bi-brightness-high"
                style="display: none"
              >
                <path
                  d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"
                />
              </svg>
              <svg
                id="dark-mode-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="25"
                height="25"
                viewBox="0 0 16 16"
                fill="currentColor"
                class="bi bi-moon"
              >
                <path
                  d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278M4.858 1.311A7.27 7.27 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.32 7.32 0 0 0 5.205-2.162q-.506.063-1.029.063c-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286"
                />
              </svg>
            </div>
          </div>
          <!-- Bottom Last updated (loaded from metadata.json) -->
          <div class="text-center mt-2">
            <span id="last-updated-date" style="user-select: none">Last Updated Date: —</span>
          </div>
        </div>
      </div>
      <hr />
      <table id="arm-table" class="table table-striped" style="width: 100%">
        <thead>
          <tr>
            <th style="width: 5%">Tech ID</th>
            <th style="width: 25%">
              <img src="./assets/images/atomic-logo.png" alt="" height="25" />
              <span class="ps-1">Atomic Attack Name</span>
            </th>
            <th style="width: 5%">Platform</th>
            <th style="width: 30%">
              <img
                src="./assets/images/sigma-logo.svg"
                alt="sigma"
                height="25"
              />
              <span class="ps-1">Sigma Rules</span>
            </th>
            <th style="width: 30%">
              <img
                style="border-radius: 10%"
                src="./assets/images/splunk-logo.png"
                alt="splunk"
                height="25"
              />
              <span class="ps-1">Splunk Rules</span>
            </th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="scrollToTopBtn" style="display: none">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="50"
          height="50"
          fill="currentColor"
          class="bi bi-arrow-up-circle"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-7.5 3.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707z"
          />
        </svg>
      </div>
    </div>

    <script src="./assets/js/jquery-3.7.1.min.js"></script>
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/dataTables.min.js"></script>
    <script src="./assets/js/dataTables.bootstrap5.min.js"></script>
    <script src="./assets/js/dataTables.buttons.min.js"></script>
    <script src="./assets/js/buttons.bootstrap5.min.js"></script>
    <script src="./assets/js/fixedHeader.bootstrap5.min.js"></script>
    <script src="./assets/js/dataTables.fixedHeader.min.js"></script>

    <script>
      $(document).ready(function () {
        // Load last updated from metadata.json (same directory)
        $.getJSON("metadata.json")
          .done(function (data) {
            var raw = data && data.last_updated ? data.last_updated : "";
            var display = "—";
            if (raw) {
              var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
              var m = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
              if (m) {
                display = months[parseInt(m[2], 10) - 1] + " " + parseInt(m[3], 10) + ", " + m[1];
              } else {
                display = raw;
              }
            }
            $("#last-updated-date").text("Last Updated Date: " + display);
          })
          .fail(function () {
            $("#last-updated-date").text("Last Updated Date: —");
          });

        $("#arm-table").DataTable({
          ajax: {
            url: "attack_rule_map.json",
            dataSrc: "",
          },
          columns: [
            {
              data: function (row) {
                const v = row.tech_id || row.technique_id;
                return v != null && String(v).trim() !== "" ? String(v) : null;
              },
              render: function (data) {
                const tid = (data != null && String(data).trim() !== "") ? String(data).trim() : null;
                if (!tid) {
                  return '<span class="text-muted">-</span>';
                }
                const href =
                  "https://www.atomicredteam.io/atomic-red-team/atomics/" + tid;
                return (
                  '<a class="btn mitre-tech-btn rounded-1" style="user-select: text;" target="_blank" href="' +
                  href +
                  '">' +
                  tid +
                  "</a>"
                );
              },
            },
            {
              data: function (row) {
                const name = (row.atomic_attack_name || row.technique_name || "").trim();
                const guid = (row.atomic_attack_guid || "").trim();
                return { name: name, guid: guid };
              },
              render: function (data) {
                const displayName = (data && data.name) ? String(data.name).trim() : "";
                const isUnknown = !displayName || displayName.toLowerCase() === "unknown";
                if (isUnknown) {
                  return '<span class="text-muted">-</span>';
                }
                let html = displayName;
                if (data && data.guid) {
                  html += '<br><small class="text-muted">GUID: ' + data.guid + "</small>";
                }
                return html;
              },
            },
            {
              data: "platform",
              render: function (data) {
                const plat = (data || "").toString().toLowerCase();
                let img = "linux-logo.svg";
                let title = "Linux";
                if (plat.indexOf("windows") >= 0) {
                  img = "windows-logo.svg";
                  title = "Windows";
                } else if (plat.indexOf("macos") >= 0 || plat.indexOf("mac") >= 0) {
                  img = "macos-logo.svg";
                  title = "macOS";
                } else if (plat) {
                  title = plat.charAt(0).toUpperCase() + plat.slice(1);
                }
                return (
                  '<img src="./assets/images/' +
                  img +
                  '" height="32" alt="' +
                  title +
                  '" title="' +
                  title +
                  '">'
                );
              },
            },
            {
              data: "sigma_rules",
              render: function (data) {
                const rules = data || [];
                if (!rules.length) return "<ul>N/A</ul>";
                let html = "<ul>";
                rules.forEach(function (r) {
                  const name = (r.rule_name || "").trim();
                  const link = r.rule_link || "#";
                  html +=
                    '<li><a target="_blank" href="' +
                    link +
                    '">' +
                    name +
                    "</a></li>";
                });
                html += "</ul>";
                return html;
              },
            },
            {
              data: "splunk_rules",
              render: function (data) {
                const rules = data || [];
                if (!rules.length) return "<ul>N/A</ul>";
                let html = "<ul>";
                rules.forEach(function (r) {
                  const name = (r.rule_name || "").trim();
                  const link = r.rule_link || "#";
                  html +=
                    '<li><a target="_blank" href="' +
                    link +
                    '">' +
                    name +
                    "</a></li>";
                });
                html += "</ul>";
                return html;
              },
            },
          ],
          paging: false,
          searching: true,
          ordering: true,
          info: true,
          fixedHeader: true,
          dom:
            "<'row'<'col-sm-12 col-md-6'B><'col-sm-12 col-md-6'f>>" +
            "<'row'<'col-sm-12'tr>>" +
            "<'row'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>",

          buttons: [
            {
              className: "btn-sm json-export",
              text: "Export JSON",
              action: function (e, dt, button, config) {
                const rows = dt.rows({ search: "applied" }).data();
                const json = JSON.stringify(
                  rows.toArray().map(function (row) {
                    const obj = {
                      tech_id: row.tech_id || row.technique_id || "",
                      atomic_attack_name:
                        row.atomic_attack_name || row.technique_name || "",
                      atomic_attack_guid: row.atomic_attack_guid || "",
                      platform: row.platform || "",
                      sigma_rules: row.sigma_rules || [],
                      splunk_rules: row.splunk_rules || [],
                    };
                    return obj;
                  }),
                  null,
                  2
                );

                const blob = new Blob([json], { type: "application/json" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "attack_rule_map.json";
                link.click();
              },
            },
          ],
          initComplete: function () {
            var openLayer = function (filename) {
              var hostname = window.location.hostname;
              if (hostname === "localhost" || hostname === "127.0.0.1") {
                alert(
                  "The official MITRE ATT&CK Navigator cannot access files on Localhost. Please deploy to Netlify/Public Server."
                );
                return;
              }
              var currentBase = window.location.href.substring(
                0,
                window.location.href.lastIndexOf("/") + 1
              );
              var jsonUrl = currentBase + filename;
              var targetUrl =
                "https://mitre-attack.github.io/attack-navigator/#layerURL=" +
                encodeURIComponent(jsonUrl);
              window.open(targetUrl, "_blank");
            };
            var $mitreGroup = $(
              '<div class="btn-group ms-2 ml-2" role="group">' +
                '<button type="button" class="btn btn-danger btn-sm text-white dropdown-toggle" data-bs-toggle="dropdown" style="font-weight: 500;">' +
                '<i class="fas fa-map-marked-alt me-1 mr-1"></i> ATT&CK&reg; Navigator <span class="caret"></span>' +
                '</button>' +
                '<ul class="dropdown-menu">' +
                '<li><a class="dropdown-item" href="#" data-layer="mitre_layer_combined.json"><i class="fas fa-layer-group me-1"></i> Sigma + Splunk</a></li>' +
                '<li><a class="dropdown-item" href="#" data-layer="mitre_layer_sigma.json"><i class="fas fa-shield-alt me-1"></i> Sigma</a></li>' +
                '<li><a class="dropdown-item" href="#" data-layer="mitre_layer_splunk.json"><i class="fas fa-chart-line me-1"></i> Splunk</a></li>' +
                '</ul></div>'
            );
            $(".dt-buttons").after($mitreGroup);
            $mitreGroup.find(".dropdown-item").on("click", function (e) {
              e.preventDefault();
              var filename = $(this).data("layer");
              openLayer(filename);
            });
          },
        });
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light") {
          $("html").attr("data-bs-theme", "light");
          toggleIcons();
        } else {
          $("html").attr("data-bs-theme", "dark");
          toggleIcons();
        }

        $("#dark-mode-icon").click(function () {
          $("html").attr("data-bs-theme", "dark");
          localStorage.setItem("theme", "dark");
          toggleIcons();
        });

        $("#light-mode-icon").click(function () {
          $("html").attr("data-bs-theme", "light");
          localStorage.setItem("theme", "light");
          toggleIcons();
        });

        function toggleIcons() {
          $(".json-export")
            .removeClass("btn-secondary")
            .addClass("btn-success");
          if ($("html").attr("data-bs-theme") === "dark") {
            $("#dark-mode-icon").hide();
            $("#light-mode-icon").show().css("color", "#adb5bd");
            $("#github-icon").attr("style", "filter: invert(0)");
          } else {
            $("#github-icon").attr("style", "filter: invert(1)");
            $("#light-mode-icon").hide();
            $("#dark-mode-icon").show().css("color", "#212529");
          }
        }

        $(window).scroll(function () {
          if ($(this).scrollTop() > 300) {
            $("#scrollToTopBtn").fadeIn();
          } else {
            $("#scrollToTopBtn").fadeOut();
          }
        });

        $("#scrollToTopBtn").click(function () {
          $("html, body").animate({ scrollTop: 0 });
          return false;
        });
      });
    </script>
  </body>
</html>
